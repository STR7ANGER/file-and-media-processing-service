services:
  postgres:
    image: postgres:17-alpine
    environment:
      { POSTGRES_USER: media, POSTGRES_PASSWORD: media, POSTGRES_DB: media }
    ports: ["5435:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U media"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  redis:
    image: redis:8-alpine
    ports: ["6381:6379"]
  mongodb:
    image: mongo:8
    ports: ["27019:27017"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9011
    environment:
      { MINIO_ROOT_USER: media, MINIO_ROOT_PASSWORD: media-local-secret }
    ports: ["9010:9000", "9011:9011"]
